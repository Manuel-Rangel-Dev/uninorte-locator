<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Uninorte Locator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
    <link rel="stylesheet" href="styles.css?v=11">
    <script src="config.js"></script>
    <script>
        if (typeof APP_CONFIG === 'undefined') {
            document.write('<script src="js/config.js"><\/script>');
        }
    </script>
    <script>
        if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.integrante) {
            document.title = APP_CONFIG.integrante;
        }
    </script>
</head>
<body>

    <div id="panelInfo">
        <h1>Uninorte Locator</h1>
        <div class="filaInfo"><span class="etiquetaInfo">LAT:</span><span id="valorLat">--</span></div>
        <div class="filaInfo"><span class="etiquetaInfo">LONG:</span><span id="valorLng">--</span></div>
        <div class="filaInfo"><span class="etiquetaInfo">DATE:</span><span id="valorFecha">--</span></div>
        <div class="filaInfo"><span class="etiquetaInfo">HOUR:</span><span id="valorHora">--</span></div>
    </div>

    <button id="btnCentrar" title="Activar modo seguimiento">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <path d="M12 2V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 19V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M2 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </button>
    <button id="btnHistoricos" title="Ver histórico de recorrido">
        <svg id="iconoHistoricos" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M12 7V12L15.5 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg id="iconoEnVivo" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
            <circle cx="12" cy="12" r="3" fill="#ffffff"/>
            <path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="7" stroke="#ffffff" stroke-width="1.5"/>
        </svg>
        <span id="textoBtnHistoricos">Históricos</span>
    </button>

    <!-- Barra de búsqueda superior para filtrar por dirección / lugar -->
    <div id="contenedorBusquedaLugar" class="contenedorBusquedaLugar" style="display: none;">
        <div class="campoBusquedaLugar">
            <svg class="iconoBusquedaLugar" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="inputBusquedaLugar" placeholder="Buscar dirección, ciudad o lugar..." autocomplete="off">
            <button type="button" id="btnLimpiarBusquedaLugar" class="btnLimpiarBusqueda" title="Borrar texto" style="display: none;">✕</button>
            <div id="spinnerBusquedaLugar" class="spinnerBusqueda" style="display: none;"></div>
        </div>
        <div id="sugerenciasBusquedaLugar" class="sugerenciasBusqueda" style="display: none;"></div>
    </div>

    <div id="panelHistoricos">
        <!-- Selector de Tipo de Filtro (Fecha / Zona) -->
        <div class="selectorTipoFiltro">
            <button id="btnFiltroFecha" class="tabTipoFiltro activo" type="button">Filtrar por fecha</button>
            <button id="btnFiltroZona" class="tabTipoFiltro" type="button">Filtrar por zona</button>
        </div>

        <!-- SECCIÓN 1: FILTRAR POR FECHA (Mantiene exactamente lo existente) -->
        <div id="vistaFiltroFecha">
            <div class="selectorRangoFecha">
                <button type="button" class="tabRangoFecha activo" id="tabDesde" title="Seleccionar fecha de inicio">
                    <span class="etiquetaRango">DESDE</span>
                    <span class="fechaRango" id="txtFechaDesde">--</span>
                </button>
                <button type="button" class="tabRangoFecha" id="tabHasta" title="Seleccionar fecha de fin">
                    <span class="etiquetaRango">HASTA</span>
                    <span class="fechaRango" id="txtFechaHasta">--</span>
                </button>
            </div>

            <div id="calendarioHeader">
                <button id="btnMesAnterior" class="navCalendario" title="Mes anterior">&#8592;</button>
                <span id="tituloMesAnio">--</span>
                <button id="btnMesSiguiente" class="navCalendario" title="Mes siguiente">&#8594;</button>
            </div>
            <div id="diasSemana">
                <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
            </div>
            <div id="gridCalendario"></div>

            <div class="filaHora">
                <span class="etiquetaHora">Hora inicio:</span>
                <div class="selectorHora">
                    <input type="text" class="inputHora" id="horaDesdeHH" maxlength="2" value="12" title="Hora (01-12)">
                    <span class="dosPuntos">:</span>
                    <input type="text" class="inputHora" id="horaDesdeMM" maxlength="2" value="00" title="Minutos (00-59)">
                    <span class="dosPuntos">:</span>
                    <input type="text" class="inputHora" id="horaDesdeSS" maxlength="2" value="00" title="Segundos (00-59)">
                    <div class="toggleAmPm" id="toggleDesde" data-valor="AM">
                        <div class="toggleOpcion">AM</div>
                        <div class="toggleOpcion">PM</div>
                        <div class="toggleSlider"></div>
                    </div>
                </div>
            </div>
            <div class="filaHora">
                <span class="etiquetaHora">Hora fin:</span>
                <div class="selectorHora">
                    <input type="text" class="inputHora" id="horaHastaHH" maxlength="2" value="11" title="Hora (01-12)">
                    <span class="dosPuntos">:</span>
                    <input type="text" class="inputHora" id="horaHastaMM" maxlength="2" value="59" title="Minutos (00-59)">
                    <span class="dosPuntos">:</span>
                    <input type="text" class="inputHora" id="horaHastaSS" maxlength="2" value="59" title="Segundos (00-59)">
                    <div class="toggleAmPm activoPM" id="toggleHasta" data-valor="PM">
                        <div class="toggleOpcion">AM</div>
                        <div class="toggleOpcion">PM</div>
                        <div class="toggleSlider"></div>
                    </div>
                </div>
            </div>

            <div class="accionesHistoricos">
                <button id="btnVerRecorrido" type="button">Ver recorrido</button>
            </div>

            <div id="estadoHistorico"></div>

            <div id="selectorRecorridos" style="display: none;">
                <div class="tituloRecorridos">
                    RECORRIDOS ENCONTRADOS
                </div>
                <div id="listaRecorridos"></div>
            </div>
        </div>

        <!-- SECCIÓN 2: FILTRAR POR ZONA (Basado en img4.png) -->
        <div id="vistaFiltroZona" style="display: none;">
            <!-- Sub-selector de Modo de Zona (En Mapa / Buscar Lugar) -->
            <div class="selectorSubmodoZona">
                <button id="btnSubmodoMapa" class="tabSubmodoZona activo" type="button">Marcar en mapa</button>
                <button id="btnSubmodoLugar" class="tabSubmodoZona" type="button">Buscar dirección</button>
            </div>

            <div id="instruccionZona" class="textoInstruccionZona">
                Haz clic en el mapa para colocar el centro de búsqueda.
            </div>

            <div class="filaRadioZona">
                <span class="etiquetaRadioZona">RADIO:</span>
                <span id="valorRadioZona" class="valorRadioZona">300 M</span>
            </div>

            <input type="range" id="sliderRadioZona" class="sliderZona" min="50" max="3000" step="25" value="300">

            <div class="filaBotonesZona">
                <button id="btnMoverCentroZona" class="btnSecundarioZona" type="button">Mover centro</button>
                <button id="btnLimpiarZona" class="btnSecundarioZona" type="button">Limpiar</button>
            </div>

            <button id="btnBuscarZona" class="btnBuscarZona" type="button">Buscar en esta zona</button>

            <div id="estadoZona" class="estadoZona"></div>

            <div id="contenedorRutasZona" style="display: none;">
                <div class="tituloRecorridos">
                    RUTAS POR EL ÁREA
                </div>
                <div id="listaRutasZona"></div>
            </div>
        </div>

        <!-- REPRODUCTOR COMPARTIDO (Se muestra al elegir un recorrido en fecha o zona) -->
        <div id="reproductorHistorico" style="display: none;">
            <div class="infoReproduccion">
                <div id="infoRecorridoSeleccionado">
                    Recorrido --
                </div>
                <div id="fechaHoraReproduccion">
                    --/--/---- --:--:--
                </div>
            </div>

            <!-- Slider -->
            <div class="contenedorSlider">
                <span id="tiempoInicioRecorrido">--:--</span>
                <input
                    type="range"
                    id="sliderRecorrido"
                    min="0"
                    max="0"
                    value="0"
                    step="1"
                >
                <span id="tiempoFinRecorrido">--:--</span>
            </div>

            <!-- Controles -->
            <div class="controlesReproduccion">
                <button id="btnPlayRecorrido" type="button">▶</button>
                <button id="btnReiniciarRecorrido" type="button">↺</button>
                <select id="velocidadRecorrido">
                    <option value="1000">1x</option>
                    <option value="500">2x</option>
                    <option value="250">4x</option>
                    <option value="100">10x</option>
                </select>
            </div>
        </div>
    </div>
    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script type="module" src="js/main.js?v=11"></script>
</body>
</html>
