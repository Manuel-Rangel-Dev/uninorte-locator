<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uninorte Locator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: monospace;
        background-color: #121212;
        color: #ffffff;
    }
    #mapa {
        width: 100%;
        height: 100%;
        background-color: #121212;
    }
    #panelInfo {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        background-color: rgba(18, 18, 18, 0.9);
        border: 1px solid #2A2A2A;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 13px;
        min-width: 200px;
    }
    #panelInfo h1 {
        color: #dc0303;
        font-size: 14px;
        margin: 0 0 8px 0;
    }
    .filaInfo {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
    }
    .etiquetaInfo {
        color: #B3B3B3;
        margin-right: 12px;
    }
    #btnCentrar {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        z-index: 1000;
        background-color: rgba(18, 18, 18, 0.9);
        border: 1px solid #2A2A2A;
        border-radius: 6px;
        color: #ffffff;
        width: 42px;
        height: 42px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #btnCentrar:hover {
        border-color: #dc0303;
    }
    #btnHistoricos {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 1000;
        background-color: rgba(18, 18, 18, 0.9);
        border: 1px solid #2A2A2A;
        border-radius: 6px;
        color: #ffffff;
        height: 38px;
        padding: 0 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: monospace;
        font-size: 13px;
    }
    #btnHistoricos:hover {
        border-color: #dc0303;
    }

    #panelHistoricos {
        display: none;
        position: absolute;
        top: 58px;
        right: 12px;
        z-index: 1000;
        background-color: rgba(18, 18, 18, 0.95);
        border: 1px solid #2A2A2A;
        border-radius: 6px;
        padding: 12px;
        width: 275px;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }
    #panelHistoricos.abierto {
        display: flex;
    }

    .selectorRangoFecha {
        display: flex;
        gap: 6px;
    }
    .tabRangoFecha {
        flex: 1;
        background-color: #1a1a1a;
        border: 1px solid #2A2A2A;
        border-radius: 4px;
        padding: 6px 4px;
        color: #ffffff;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-family: monospace;
        transition: all 0.2s ease;
    }
    .tabRangoFecha:hover {
        border-color: #555555;
    }
    .tabRangoFecha.activo {
        border-color: #dc0303;
        background-color: rgba(220, 3, 3, 0.15);
    }
    .etiquetaRango {
        font-size: 9px;
        color: #888888;
        font-weight: bold;
        letter-spacing: 0.5px;
    }
    .tabRangoFecha.activo .etiquetaRango {
        color: #dc0303;
    }
    .fechaRango {
        font-size: 11px;
        font-weight: bold;
    }

    #calendarioHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
    }
    .navCalendario {
        background: none;
        border: 1px solid #2A2A2A;
        color: #ffffff;
        border-radius: 4px;
        width: 24px;
        height: 24px;
        cursor: pointer;
    }
    .navCalendario:disabled {
        color: #555555;
        cursor: not-allowed;
    }
    .navCalendario:not(:disabled):hover {
        border-color: #dc0303;
    }

    #diasSemana, #gridCalendario {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-size: 11px;
    }
    #diasSemana {
        color: #B3B3B3;
        margin-bottom: 4px;
    }
    .diaCalendario {
        padding: 5px 0;
        cursor: pointer;
        transition: background-color 0.15s;
    }
    .diaCalendario:hover {
        background-color: #2e2e2e;
    }
    .diaInicio {
        background-color: #dc0303 !important;
        color: #ffffff;
        border-radius: 4px 0 0 4px;
        font-weight: bold;
    }
    .diaFin {
        background-color: #dc0303 !important;
        color: #ffffff;
        border-radius: 0 4px 4px 0;
        font-weight: bold;
    }
    .diaInicio.diaFin {
        border-radius: 4px !important;
    }
    .diaEnRango {
        background-color: rgba(220, 3, 3, 0.25);
        color: #ffffff;
    }

    .filaHora {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
    }
    .etiquetaHora {
        color: #B3B3B3;
    }
    .selectorHora {
        display: flex;
        align-items: center;
        gap: 3px;
    }
    .inputHora {
        width: 24px;
        background-color: #1c1c1c;
        border: 1px solid #2A2A2A;
        color: #ffffff;
        text-align: center;
        font-family: monospace;
        font-size: 12px;
        border-radius: 4px;
        padding: 3px 0;
    }
    .dosPuntos {
        color: #B3B3B3;
    }

    .toggleAmPm {
        position: relative;
        width: 54px;
        height: 22px;
        background-color: #1c1c1c;
        border: 1px solid #2A2A2A;
        border-radius: 11px;
        display: flex;
        cursor: pointer;
        overflow: hidden;
    }
    .toggleOpcion {
        flex: 1;
        text-align: center;
        font-size: 9px;
        line-height: 20px;
        z-index: 1;
        color: #B3B3B3;
    }
    .toggleSlider {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 26px;
        height: 18px;
        background-color: #dc0303;
        border-radius: 9px;
        transition: transform 0.2s ease;
    }
    .toggleAmPm.activoPM .toggleSlider {
        transform: translateX(26px);
    }

    #estadoHistorico {
        font-size: 11px;
        text-align: center;
        min-height: 14px;
        color: #B3B3B3;
    }

    .accionesHistoricos {
        display: flex;
        gap: 6px;
    }
    #btnVerRecorrido {
        flex: 1;
        background-color: #dc0303;
        border: none;
        color: #ffffff;
        padding: 8px 0;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    #btnVerRecorrido:hover {
        background-color: #a80202;
    }
    #btnVerRecorrido:disabled {
        background-color: #555555;
        cursor: not-allowed;
    }
    #btnLimpiarRecorrido {
        display: none;
        background-color: #2A2A2A;
        border: 1px solid #3A3A3A;
        color: #ffffff;
        padding: 8px 10px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    #btnLimpiarRecorrido:hover {
        background-color: #383838;
        border-color: #555555;
    }
</style>
</head>
<body>

<div id="panelInfo">
    <h1>Uninorte Locator</h1>
    <div class="filaInfo"><span class="etiquetaInfo">LAT:</span><span id="valorLat">--</span></div>
    <div class="filaInfo"><span class="etiquetaInfo">LONG:</span><span id="valorLng">--</span></div>
    <div class="filaInfo"><span class="etiquetaInfo">DATE:</span><span id="valorFecha">--</span></div>
    <div class="filaInfo"><span class="etiquetaInfo">HOUR:</span><span id="valorHora">--</span></div>
</div>

<button id="btnCentrar" title="Centrar en el vehículo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="3" fill="#ffffff"/>
        <path d="M12 2V5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 19V22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M2 12H5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M19 12H22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="7" stroke="#ffffff" stroke-width="1.5"/>
    </svg>
</button>
<button id="btnHistoricos" title="Ver histórico de recorrido">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="1.5"/>
        <path d="M12 7V12L15.5 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Históricos</span>
</button>

<div id="panelHistoricos">
    <div class="selectorRangoFecha">
        <button type="button" class="tabRangoFecha activo" id="tabDesde" title="Seleccionar fecha de inicio">
            <span class="etiquetaRango">DESDE</span>
            <span class="fechaRango" id="txtFechaDesde">--</span>
        </button>
        <button type="button" class="tabRangoFecha" id="tabHasta" title="Seleccionar fecha de fin">
            <span class="etiquetaRango">HASTA</span>
            <span class="fechaRango" id="txtFechaHasta">--</span>
        </button>
    </div>

    <div id="calendarioHeader">
        <button id="btnMesAnterior" class="navCalendario" title="Mes anterior">&#8592;</button>
        <span id="tituloMesAnio">--</span>
        <button id="btnMesSiguiente" class="navCalendario" title="Mes siguiente">&#8594;</button>
    </div>
    <div id="diasSemana">
        <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
    </div>
    <div id="gridCalendario"></div>

    <div class="filaHora">
        <span class="etiquetaHora">Hora inicio:</span>
        <div class="selectorHora">
            <input type="text" class="inputHora" id="horaDesdeHH" maxlength="2" value="12" title="Hora (01-12)">
            <span class="dosPuntos">:</span>
            <input type="text" class="inputHora" id="horaDesdeMM" maxlength="2" value="00" title="Minutos (00-59)">
            <span class="dosPuntos">:</span>
            <input type="text" class="inputHora" id="horaDesdeSS" maxlength="2" value="00" title="Segundos (00-59)">
            <div class="toggleAmPm" id="toggleDesde" data-valor="AM">
                <div class="toggleOpcion">AM</div>
                <div class="toggleOpcion">PM</div>
                <div class="toggleSlider"></div>
            </div>
        </div>
    </div>
    <div class="filaHora">
        <span class="etiquetaHora">Hora fin:</span>
        <div class="selectorHora">
            <input type="text" class="inputHora" id="horaHastaHH" maxlength="2" value="11" title="Hora (01-12)">
            <span class="dosPuntos">:</span>
            <input type="text" class="inputHora" id="horaHastaMM" maxlength="2" value="59" title="Minutos (00-59)">
            <span class="dosPuntos">:</span>
            <input type="text" class="inputHora" id="horaHastaSS" maxlength="2" value="59" title="Segundos (00-59)">
            <div class="toggleAmPm activoPM" id="toggleHasta" data-valor="PM">
                <div class="toggleOpcion">AM</div>
                <div class="toggleOpcion">PM</div>
                <div class="toggleSlider"></div>
            </div>
        </div>
    </div>

    <div id="estadoHistorico"></div>

    <div class="accionesHistoricos">
        <button id="btnLimpiarRecorrido" type="button">Limpiar</button>
        <button id="btnVerRecorrido" type="button">Ver recorrido</button>
    </div>
</div>
<div id="mapa"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
<script src="config.js"></script>
<script>
    const API_BASE = '';
    const INTERVALO_MS = 5000;
    const CENTRO_DEFAULT = [11.019, -74.851]; // Barranquilla, fallback inicial

    document.title = APP_CONFIG.integrante;
    
    let mapa;
    let marcador;
    let recorrido;
    let recorridoHistorico;
    let ultimaPosicionRecorrido = null;
    let mapaCentradoInicial = false;

    async function refrescarCampo(nombreCampo, idElemento) {
        const elemento = document.getElementById(idElemento);
        try {
            const respuesta = await fetch(`${API_BASE}/api/${nombreCampo}`);
            if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
            const datos = await respuesta.json();
            const valor = datos[nombreCampo];
            elemento.textContent = (valor === null || valor === undefined) ? '--' : valor;
            return valor;
        } catch (error) {
            elemento.textContent = 'Error';
            console.error(`Error al refrescar ${nombreCampo}:`, error);
            return null;
        }
    }

    async function actualizarMarcador() {
        const lat = await refrescarCampo('lat', 'valorLat');
        const lng = await refrescarCampo('lng', 'valorLng');
        refrescarCampo('fecha', 'valorFecha');
        refrescarCampo('hora', 'valorHora');

        if (lat === null || lng === null || isNaN(Number(lat)) || isNaN(Number(lng))) return;

        const posicion = [Number(lat), Number(lng)];
        marcador.setLatLng(posicion);

        if (!mapaCentradoInicial) {
            mapa.setView(posicion, mapa.getZoom());
            mapaCentradoInicial = true;
        }

        const esPosicionNueva = !ultimaPosicionRecorrido
            || ultimaPosicionRecorrido[0] !== posicion[0]
            || ultimaPosicionRecorrido[1] !== posicion[1];

        if (esPosicionNueva) {
            recorrido.addLatLng(posicion);
            ultimaPosicionRecorrido = posicion;
        }
    }

    async function initMap() {
        let centroInicial = CENTRO_DEFAULT;
        try {
            const res = await fetch(`${API_BASE}/api/ultimo`);
            if (res.ok) {
                const datos = await res.json();
                if (datos.lat !== null && datos.lng !== null && !isNaN(Number(datos.lat)) && !isNaN(Number(datos.lng))) {
                    centroInicial = [Number(datos.lat), Number(datos.lng)];
                    mapaCentradoInicial = true;
                }
            }
        } catch (e) {
            console.warn('No se pudo obtener la posición inicial desde /api/ultimo, usando centro por defecto:', e);
        }

        mapa = L.map('mapa').setView(centroInicial, 15);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(mapa);

        marcador = L.marker(centroInicial).addTo(mapa)
            .bindPopup('Vehículo');
        document.getElementById('btnCentrar').addEventListener('click', () => {
            mapa.setView(marcador.getLatLng(), mapa.getZoom());
        });

        recorrido = L.polyline([], { color: '#C8102E', weight: 3 }).addTo(mapa);
        recorridoHistorico = L.polyline([], { color: '#4A90D9', weight: 3, dashArray: '6,4' }).addTo(mapa);

        initHistoricos();

        actualizarMarcador();
        setInterval(actualizarMarcador, INTERVALO_MS);
    }
    
    const HISTORICO_MIN_ANIO = 2020;
    let fechaCalendario = new Date();
    let fechaDesde = new Date();
    let fechaHasta = new Date();
    let modoSeleccion = 'desde';

    function normalizarFecha(d) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    function formatearFechaCorta(d) {
        if (!d) return '--';
        const nombresMes = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        return `${d.getDate()} ${nombresMes[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatearFechaISO(d) {
        const anio = d.getFullYear();
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const dia = String(d.getDate()).padStart(2, '0');
        return `${anio}-${mes}-${dia}`;
    }

    function mostrarEstadoHistorico(mensaje, color = '#B3B3B3') {
        const el = document.getElementById('estadoHistorico');
        if (el) {
            el.textContent = mensaje;
            el.style.color = color;
        }
    }

    function actualizarPillsFecha() {
        document.getElementById('txtFechaDesde').textContent = formatearFechaCorta(fechaDesde);
        document.getElementById('txtFechaHasta').textContent = formatearFechaCorta(fechaHasta);
        document.getElementById('tabDesde').classList.toggle('activo', modoSeleccion === 'desde');
        document.getElementById('tabHasta').classList.toggle('activo', modoSeleccion === 'hasta');
    }

    function renderCalendario() {
        const anio = fechaCalendario.getFullYear();
        const mes = fechaCalendario.getMonth();
        const nombresMes = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        document.getElementById('tituloMesAnio').textContent = `${nombresMes[mes]} ${anio}`;

        const grid = document.getElementById('gridCalendario');
        grid.innerHTML = '';

        const primerDiaSemana = new Date(anio, mes, 1).getDay();
        const diasEnMes = new Date(anio, mes + 1, 0).getDate();

        for (let i = 0; i < primerDiaSemana; i++) {
            grid.appendChild(document.createElement('span'));
        }

        const tDesde = fechaDesde ? normalizarFecha(fechaDesde) : null;
        const tHasta = fechaHasta ? normalizarFecha(fechaHasta) : null;

        for (let dia = 1; dia <= diasEnMes; dia++) {
            const celda = document.createElement('span');
            celda.textContent = dia;
            celda.classList.add('diaCalendario');

            const tActual = new Date(anio, mes, dia).getTime();
            const esInicio = tDesde && tActual === tDesde;
            const esFin = tHasta && tActual === tHasta;
            const enRango = tDesde && tHasta && tActual > tDesde && tActual < tHasta;

            if (esInicio) celda.classList.add('diaInicio');
            if (esFin) celda.classList.add('diaFin');
            if (enRango) celda.classList.add('diaEnRango');

            celda.addEventListener('click', () => {
                const diaClick = new Date(anio, mes, dia);
                if (modoSeleccion === 'desde') {
                    fechaDesde = diaClick;
                    if (fechaHasta && normalizarFecha(fechaHasta) < normalizarFecha(fechaDesde)) {
                        fechaHasta = new Date(fechaDesde);
                    }
                    modoSeleccion = 'hasta';
                } else {
                    if (fechaDesde && normalizarFecha(diaClick) < normalizarFecha(fechaDesde)) {
                        fechaDesde = diaClick;
                    } else {
                        fechaHasta = diaClick;
                    }
                }
                actualizarPillsFecha();
                renderCalendario();
            });

            grid.appendChild(celda);
        }

        document.getElementById('btnMesAnterior').disabled = (anio === HISTORICO_MIN_ANIO && mes === 0);
    }

    function cambiarMes(delta) {
        const nuevaFecha = new Date(fechaCalendario.getFullYear(), fechaCalendario.getMonth() + delta, 1);
        if (nuevaFecha.getFullYear() < HISTORICO_MIN_ANIO) return;
        fechaCalendario = nuevaFecha;
        renderCalendario();
    }

    function limitarInputHora(input, max) {
        input.addEventListener('input', () => {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 2);
        });
        input.addEventListener('blur', () => {
            let valor = parseInt(input.value, 10);
            if (isNaN(valor)) valor = 0;
            valor = Math.max(0, Math.min(max, valor));
            input.value = String(valor).padStart(2, '0');
        });
    }

    function configurarToggleAmPm(idToggle) {
        const toggle = document.getElementById(idToggle);
        toggle.addEventListener('click', () => {
            const nuevoValor = toggle.dataset.valor === 'AM' ? 'PM' : 'AM';
            toggle.dataset.valor = nuevoValor;
            toggle.classList.toggle('activoPM', nuevoValor === 'PM');
        });
    }

    function obtenerHora24(idHH, idMM, idSS, idToggle) {
        let hh = parseInt(document.getElementById(idHH).value, 10);
        if (isNaN(hh)) hh = 0;
        const mm = (document.getElementById(idMM).value || '00').padStart(2, '0');
        const ss = (document.getElementById(idSS).value || '00').padStart(2, '0');
        const esPM = document.getElementById(idToggle).dataset.valor === 'PM';

        if (hh === 12) hh = 0;
        if (esPM) hh += 12;

        return `${String(hh).padStart(2, '0')}:${mm}:${ss}`;
    }

    function initHistoricos() {
        document.getElementById('btnHistoricos').addEventListener('click', () => {
            document.getElementById('panelHistoricos').classList.toggle('abierto');
        });

        document.getElementById('tabDesde').addEventListener('click', () => {
            modoSeleccion = 'desde';
            if (fechaDesde) {
                fechaCalendario = new Date(fechaDesde.getFullYear(), fechaDesde.getMonth(), 1);
            }
            actualizarPillsFecha();
            renderCalendario();
        });

        document.getElementById('tabHasta').addEventListener('click', () => {
            modoSeleccion = 'hasta';
            if (fechaHasta) {
                fechaCalendario = new Date(fechaHasta.getFullYear(), fechaHasta.getMonth(), 1);
            }
            actualizarPillsFecha();
            renderCalendario();
        });

        document.getElementById('btnMesAnterior').addEventListener('click', () => cambiarMes(-1));
        document.getElementById('btnMesSiguiente').addEventListener('click', () => cambiarMes(1));

        limitarInputHora(document.getElementById('horaDesdeHH'), 12);
        limitarInputHora(document.getElementById('horaDesdeMM'), 59);
        limitarInputHora(document.getElementById('horaDesdeSS'), 59);
        limitarInputHora(document.getElementById('horaHastaHH'), 12);
        limitarInputHora(document.getElementById('horaHastaMM'), 59);
        limitarInputHora(document.getElementById('horaHastaSS'), 59);

        configurarToggleAmPm('toggleDesde');
        configurarToggleAmPm('toggleHasta');

        document.getElementById('btnLimpiarRecorrido').addEventListener('click', () => {
            recorridoHistorico.setLatLngs([]);
            document.getElementById('btnLimpiarRecorrido').style.display = 'none';
            mostrarEstadoHistorico('');
            if (marcador && marcador.getLatLng()) {
                mapa.setView(marcador.getLatLng(), mapa.getZoom());
            }
        });

        document.getElementById('btnVerRecorrido').addEventListener('click', async () => {
            if (!fechaDesde || !fechaHasta) {
                mostrarEstadoHistorico('Selecciona las fechas en el calendario.', '#ff6b6b');
                return;
            }

            const fechaDesdeISO = formatearFechaISO(fechaDesde);
            const fechaHastaISO = formatearFechaISO(fechaHasta);
            const horaDesde = obtenerHora24('horaDesdeHH', 'horaDesdeMM', 'horaDesdeSS', 'toggleDesde');
            const horaHasta = obtenerHora24('horaHastaHH', 'horaHastaMM', 'horaHastaSS', 'toggleHasta');

            const dtInicio = new Date(`${fechaDesdeISO}T${horaDesde}`);
            const dtFin = new Date(`${fechaHastaISO}T${horaHasta}`);

            if (dtFin < dtInicio) {
                mostrarEstadoHistorico('La fecha/hora final debe ser posterior a la inicial.', '#ff6b6b');
                return;
            }

            mostrarEstadoHistorico('Cargando recorrido...', '#B3B3B3');
            document.getElementById('btnVerRecorrido').disabled = true;

            try {
                const url = `${API_BASE}/api/historico?fecha_desde=${fechaDesdeISO}&hora_desde=${horaDesde}&fecha_hasta=${fechaHastaISO}&hora_hasta=${horaHasta}`;
                const respuesta = await fetch(url);
                if (!respuesta.ok) {
                    const errData = await respuesta.json().catch(() => null);
                    throw new Error(errData && errData.error ? errData.error : `HTTP ${respuesta.status}`);
                }
                const puntos = await respuesta.json();

                if (!puntos || puntos.length === 0) {
                    recorridoHistorico.setLatLngs([]);
                    document.getElementById('btnLimpiarRecorrido').style.display = 'none';
                    mostrarEstadoHistorico('No hay puntos en este rango.', '#e5a50a');
                    return;
                }

                recorridoHistorico.setLatLngs(puntos.map(p => [p.lat, p.lng]));
                mapa.fitBounds(recorridoHistorico.getBounds(), { padding: [30, 30] });
                mostrarEstadoHistorico(`${puntos.length} punto(s) encontrado(s)`, '#4cd964');
                document.getElementById('btnLimpiarRecorrido').style.display = 'block';
            } catch (error) {
                console.error('Error al obtener histórico:', error);
                mostrarEstadoHistorico(error.message || 'Error al cargar histórico', '#ff6b6b');
            } finally {
                document.getElementById('btnVerRecorrido').disabled = false;
            }
        });

        actualizarPillsFecha();
        renderCalendario();
    }
        document.addEventListener('DOMContentLoaded', initMap);
</script>

</body>
</html>
