<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uninorte Locator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="panelInfo">
        <h1>Uninorte Locator</h1>
        <div class="filaInfo"><span class="etiquetaInfo">LAT:</span><span id="valorLat">--</span></div>
        <div class="filaInfo"><span class="etiquetaInfo">LONG:</span><span id="valorLng">--</span></div>
        <div class="filaInfo"><span class="etiquetaInfo">DATE:</span><span id="valorFecha">--</span></div>
        <div class="filaInfo"><span class="etiquetaInfo">HOUR:</span><span id="valorHora">--</span></div>
    </div>

    <button id="btnCentrar" title="Activar modo seguimiento">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <path d="M12 2V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 19V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M2 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </button>
    <button id="btnHistoricos" title="Ver histórico de recorrido">
        <svg id="iconoHistoricos" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M12 7V12L15.5 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg id="iconoEnVivo" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
            <circle cx="12" cy="12" r="3" fill="#ffffff"/>
            <path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="7" stroke="#ffffff" stroke-width="1.5"/>
        </svg>
        <span id="textoBtnHistoricos">Históricos</span>
    </button>

    <div id="panelHistoricos">
        <div class="selectorRangoFecha">
            <button type="button" class="tabRangoFecha activo" id="tabDesde" title="Seleccionar fecha de inicio">
                <span class="etiquetaRango">DESDE</span>
                <span class="fechaRango" id="txtFechaDesde">--</span>
            </button>
            <button type="button" class="tabRangoFecha" id="tabHasta" title="Seleccionar fecha de fin">
                <span class="etiquetaRango">HASTA</span>
                <span class="fechaRango" id="txtFechaHasta">--</span>
            </button>
        </div>

        <div id="calendarioHeader">
            <button id="btnMesAnterior" class="navCalendario" title="Mes anterior">&#8592;</button>
            <span id="tituloMesAnio">--</span>
            <button id="btnMesSiguiente" class="navCalendario" title="Mes siguiente">&#8594;</button>
        </div>
        <div id="diasSemana">
            <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
        </div>
        <div id="gridCalendario"></div>

        <div class="filaHora">
            <span class="etiquetaHora">Hora inicio:</span>
            <div class="selectorHora">
                <input type="text" class="inputHora" id="horaDesdeHH" maxlength="2" value="12" title="Hora (01-12)">
                <span class="dosPuntos">:</span>
                <input type="text" class="inputHora" id="horaDesdeMM" maxlength="2" value="00" title="Minutos (00-59)">
                <span class="dosPuntos">:</span>
                <input type="text" class="inputHora" id="horaDesdeSS" maxlength="2" value="00" title="Segundos (00-59)">
                <div class="toggleAmPm" id="toggleDesde" data-valor="AM">
                    <div class="toggleOpcion">AM</div>
                    <div class="toggleOpcion">PM</div>
                    <div class="toggleSlider"></div>
                </div>
            </div>
        </div>
        <div class="filaHora">
            <span class="etiquetaHora">Hora fin:</span>
            <div class="selectorHora">
                <input type="text" class="inputHora" id="horaHastaHH" maxlength="2" value="11" title="Hora (01-12)">
                <span class="dosPuntos">:</span>
                <input type="text" class="inputHora" id="horaHastaMM" maxlength="2" value="59" title="Minutos (00-59)">
                <span class="dosPuntos">:</span>
                <input type="text" class="inputHora" id="horaHastaSS" maxlength="2" value="59" title="Segundos (00-59)">
                <div class="toggleAmPm activoPM" id="toggleHasta" data-valor="PM">
                    <div class="toggleOpcion">AM</div>
                    <div class="toggleOpcion">PM</div>
                    <div class="toggleSlider"></div>
                </div>
            </div>
        </div>

        <div id="estadoHistorico"></div>

        <div class="accionesHistoricos">
            <button id="btnVerRecorrido" type="button">Ver recorrido</button>
        </div>
    </div>
    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
