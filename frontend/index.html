<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uninorte Locator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: monospace;
        background-color: #121212;
        color: #ffffff;
    }
    #mapa {
        width: 100%;
        height: 100%;
        background-color: #121212;
    }
    #panelInfo {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        background-color: rgba(18, 18, 18, 0.9);
        border: 1px solid #2A2A2A;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 13px;
        min-width: 200px;
    }
    #panelInfo h1 {
        color: #e6ff01;
        font-size: 14px;
        margin: 0 0 8px 0;
    }
    .filaInfo {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
    }
    .etiquetaInfo {
        color: #B3B3B3;
        margin-right: 12px;
    }
</style>
</head>
<body>

<div id="panelInfo">
    <h1>Uninorte Locator_1.0</h1>
    <div class="filaInfo"><span class="etiquetaInfo">LAT:</span><span id="valorLat">--</span></div>
    <div class="filaInfo"><span class="etiquetaInfo">LONG:</span><span id="valorLng">--</span></div>
    <div class="filaInfo"><span class="etiquetaInfo">DATE:</span><span id="valorFecha">--</span></div>
    <div class="filaInfo"><span class="etiquetaInfo">HOUR:</span><span id="valorHora">--</span></div>
</div>

<div id="mapa"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
<script src="config.js"></script>
<script>
    const API_BASE = '';
    const INTERVALO_MS = 5000;
    const CENTRO_DEFAULT = [11.019, -74.851]; // Barranquilla, fallback inicial

    document.title = APP_CONFIG.integrante;
    
    let mapa;
    let marcador;
    let recorrido;
    let ultimaPosicionRecorrido = null;

    async function refrescarCampo(nombreCampo, idElemento) {
        const elemento = document.getElementById(idElemento);
        try {
            const respuesta = await fetch(`${API_BASE}/api/${nombreCampo}`);
            if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
            const datos = await respuesta.json();
            const valor = datos[nombreCampo];
            elemento.textContent = (valor === null || valor === undefined) ? '--' : valor;
            return valor;
        } catch (error) {
            elemento.textContent = 'Error';
            console.error(`Error al refrescar ${nombreCampo}:`, error);
            return null;
        }
    }

    async function actualizarMarcador() {
        const lat = await refrescarCampo('lat', 'valorLat');
        const lng = await refrescarCampo('lng', 'valorLng');
        refrescarCampo('fecha', 'valorFecha');
        refrescarCampo('hora', 'valorHora');

        if (lat === null || lng === null) return;

        const posicion = [Number(lat), Number(lng)];
        marcador.setLatLng(posicion);
        mapa.panTo(posicion);

        const esPosicionNueva = !ultimaPosicionRecorrido
            || ultimaPosicionRecorrido[0] !== posicion[0]
            || ultimaPosicionRecorrido[1] !== posicion[1];

        if (esPosicionNueva) {
            recorrido.addLatLng(posicion);
            ultimaPosicionRecorrido = posicion;
        }
    }

    function initMap() {
        mapa = L.map('mapa').setView(CENTRO_DEFAULT, 15);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(mapa);

        marcador = L.marker(CENTRO_DEFAULT).addTo(mapa)
            .bindPopup('Vehículo');

        // El recorrido vive solo en memoria: se reinicia en cada carga/recarga de la página.
        recorrido = L.polyline([], { color: '#C8102E', weight: 3 }).addTo(mapa);

        actualizarMarcador();
        setInterval(actualizarMarcador, INTERVALO_MS);
    }

    document.addEventListener('DOMContentLoaded', initMap);
</script>

</body>
</html>
